<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbasi Publication Network (APN) - Inventory & Production ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apn: {
                            blue: '#4885a6',
                            hover: '#3d7391',
                            dark: '#1b3240'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Typography: English (Plus Jakarta Sans & Inter) + Urdu (Jameel Noori Nastaleeq & Noto Nastaliq) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">
    <!-- Custom Style with Typography -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-[#f4f7f9] antialiased">
    <!-- Main Application Container rendered by app.js -->
    <div id="appRoot">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center p-8 bg-white rounded-2xl shadow-lg border border-slate-200">
                <div class="w-12 h-12 border-4 border-[#4885a6] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <h3 class="text-lg font-bold text-slate-800">عباسی پبلیکیشن نیٹ ورک</h3>
                <p class="text-xs text-slate-500 mt-1">سسٹم لوڈ ہو رہا ہے، براہِ کرم انتظار فرمائیں...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/xlsx.full.min.js"></script>
    <script src="js/barcode.js"></script>
    <script src="js/default_materials.js"></script>
    <script src="js/stock_data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
